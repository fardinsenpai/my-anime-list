name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject API keys
        env:
          G1: ${{ secrets.GROQ_KEY_1 }}
          G2: ${{ secrets.GROQ_KEY_2 }}
          G3: ${{ secrets.GROQ_KEY_3 }}
          G4: ${{ secrets.GROQ_KEY_4 }}
          G5: ${{ secrets.GROQ_KEY_5 }}
          M1: ${{ secrets.GEMINI_KEY_1 }}
          M2: ${{ secrets.GEMINI_KEY_2 }}
        run: |
          have=0
          for i in 1 2 3 4 5; do
            eval val=\$G$i
            if [ -n "$val" ]; then
              have=1
              sed -i "s|GROQ_KEY_${i}|${val}|g" script.js
            else
              sed -i "s|GROQ_KEY_${i}||g" script.js
            fi
          done
          for i in 1 2; do
            eval val=\$M$i
            if [ -n "$val" ]; then
              sed -i "s|GEMINI_KEY_${i}|${val}|g" script.js
            else
              sed -i "s|GEMINI_KEY_${i}||g" script.js
            fi
          done
          if [ "$have" -eq 0 ]; then
            echo "::error::No GROQ_KEY_1..5 secret is set. Add at least one in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if grep -qE 'GROQ_KEY_[0-9]|GEMINI_KEY_[0-9]' script.js; then
            echo "::error::Key injection left a placeholder in script.js. The deploy was stopped before publishing a broken AI."
            exit 1
          fi
      - name: Write the build stamp
        run: |
          echo "{\"build\":\"${GITHUB_SHA}\",\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4