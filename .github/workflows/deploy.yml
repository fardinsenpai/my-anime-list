name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject API keys
        env:
          KEY1: ${{ secrets.GROQ_KEY_1 }}
          KEY2: ${{ secrets.GROQ_KEY_2 }}
          KEY3: ${{ secrets.GROQ_KEY_3 }}
        run: |
          if [ -z "$KEY1" ] || [ -z "$KEY2" ] || [ -z "$KEY3" ]; then
            echo "::error::One or more GROQ_KEY_1/2/3 secrets are empty. Add all three in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          sed -i "s/GROQ_KEY_1/${KEY1}/g" script.js
          sed -i "s/GROQ_KEY_2/${KEY2}/g" script.js
          sed -i "s/GROQ_KEY_3/${KEY3}/g" script.js
          if grep -q 'GROQ_KEY_' script.js; then
            echo "::error::Key injection left a placeholder in script.js. The deploy was stopped before publishing a broken AI."
            exit 1
          fi
      - name: Write the build stamp
        run: |
          echo "{\"build\":\"${GITHUB_SHA}\",\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
